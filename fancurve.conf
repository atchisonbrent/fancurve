# Settings for fancurve. Every key is required; `fancurve check` validates it.
# Defaults were chosen on an M6 Mac mini for quiet operation. Its fan spans
# 1,000 to 4,900 rpm; its owner finds 2,700 rpm unobtrusive and the maximum loud.
#
# Comma-separated SMC temperature prefixes: 1 to 16 prefixes, each 2 to 4
# letters or digits beginning with T, without spaces. The hottest matching
# sensor supplies each reading. Unmatched prefixes are reported; at least
# one sensor must match. `fancurve check` lists what each prefix reads.
# These six are chip temperatures on the M6 and M2 Mac mini (regulators
# beside the chip, performance and efficiency cores, GPU). Sensor names
# differ between chip families: a prefix that is a core temperature on one
# can be something else on another, so check before adding one.
sensors=TVD,TCM,TP,Tp,Tg,Te
# Average temperature (degrees C) at which the controller takes the fan.
# start must be at least 40 and at most full - 5. Below it, macOS keeps control.
start=80
# Temperature where the straight-line curve reaches max_rpm: start + 5 to 110.
full=90
# Return to macOS below start - hysteresis; range 1 to start - 30 degrees C.
hysteresis=6
# Requested speed ceiling: 1,500 to 20,000 rpm, capped at the fan's maximum.
# It must leave at least 100 rpm above the fan's minimum. Raise for more cooling.
max_rpm=2700
# Maximum change in speed per second, in either direction: 10 to 1,000 rpm/s.
ramp=25
# Seconds between readings: 1 to 10.
interval=2
# Seconds of readings to average: interval to 120.
window=30
